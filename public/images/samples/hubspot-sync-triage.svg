<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Illustrative sync triage flowchart">
<defs>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#e3ded4"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1c1f23" flood-opacity="0.08"/></filter>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#faf8f4"/><stop offset="1" stop-color="#eaf2f0"/></linearGradient>
  
</defs>
<rect width="1600" height="900" fill="#f7f5f0"/>
<rect width="1600" height="900" fill="url(#dots)"/>
<text x="96" y="96" text-anchor="start" font-size="15" font-weight="600" fill="#6b7178" letter-spacing="2.4">SYNC TRIAGE ORDER</text><rect x="100" y="170" width="400" height="160" rx="18" fill="#ffffff" stroke="#d9d3c7" stroke-width="1.5" filter="url(#shadow)"/><circle cx="150" cy="222" r="22" fill="#e2efed"/><text x="150" y="230" text-anchor="middle" font-size="20" font-weight="700" fill="#0e5f5b">1</text><text x="190" y="230" text-anchor="start" font-size="24" font-weight="650" fill="#1c1f23">Read the error</text><text x="128" y="290" text-anchor="start" font-size="18" font-weight="500" fill="#6b7178">Copy the exact message</text><line x1="506" y1="250" x2="586" y2="250" stroke="#7fb3ae" stroke-width="2.5" stroke-linecap="round"/><polygon points="584,243 584,257 594,250" fill="#7fb3ae"/><rect x="600" y="170" width="400" height="160" rx="18" fill="#ffffff" stroke="#d9d3c7" stroke-width="1.5" filter="url(#shadow)"/><circle cx="650" cy="222" r="22" fill="#e2efed"/><text x="650" y="230" text-anchor="middle" font-size="20" font-weight="700" fill="#0e5f5b">2</text><text x="690" y="230" text-anchor="start" font-size="24" font-weight="650" fill="#1c1f23">Should it sync?</text><text x="628" y="290" text-anchor="start" font-size="18" font-weight="500" fill="#6b7178">Inclusion lists, sync rules</text><line x1="1006" y1="250" x2="1086" y2="250" stroke="#7fb3ae" stroke-width="2.5" stroke-linecap="round"/><polygon points="1084,243 1084,257 1094,250" fill="#7fb3ae"/><rect x="1100" y="170" width="400" height="160" rx="18" fill="#ffffff" stroke="#d9d3c7" stroke-width="1.5" filter="url(#shadow)"/><circle cx="1150" cy="222" r="22" fill="#e2efed"/><text x="1150" y="230" text-anchor="middle" font-size="20" font-weight="700" fill="#0e5f5b">3</text><text x="1190" y="230" text-anchor="start" font-size="24" font-weight="650" fill="#1c1f23">Field mapping</text><text x="1128" y="290" text-anchor="start" font-size="18" font-weight="500" fill="#6b7178">Type, direction, access</text><rect x="100" y="470" width="400" height="160" rx="18" fill="#ffffff" stroke="#d9d3c7" stroke-width="1.5" filter="url(#shadow)"/><circle cx="150" cy="522" r="22" fill="#e2efed"/><text x="150" y="530" text-anchor="middle" font-size="20" font-weight="700" fill="#0e5f5b">4</text><text x="190" y="530" text-anchor="start" font-size="24" font-weight="650" fill="#1c1f23">Picklist values</text><text x="128" y="590" text-anchor="start" font-size="18" font-weight="500" fill="#6b7178">Exact values, spacing</text><line x1="506" y1="550" x2="586" y2="550" stroke="#7fb3ae" stroke-width="2.5" stroke-linecap="round"/><polygon points="584,543 584,557 594,550" fill="#7fb3ae"/><rect x="600" y="470" width="400" height="160" rx="18" fill="#ffffff" stroke="#d9d3c7" stroke-width="1.5" filter="url(#shadow)"/><circle cx="650" cy="522" r="22" fill="#e2efed"/><text x="650" y="530" text-anchor="middle" font-size="20" font-weight="700" fill="#0e5f5b">5</text><text x="690" y="530" text-anchor="start" font-size="24" font-weight="650" fill="#1c1f23">Validation rules</text><text x="628" y="590" text-anchor="start" font-size="18" font-weight="500" fill="#6b7178">Integration-user exceptions</text><line x1="1006" y1="550" x2="1086" y2="550" stroke="#7fb3ae" stroke-width="2.5" stroke-linecap="round"/><polygon points="1084,543 1084,557 1094,550" fill="#7fb3ae"/><rect x="1100" y="470" width="400" height="160" rx="18" fill="#ffffff" stroke="#d9d3c7" stroke-width="1.5" filter="url(#shadow)"/><circle cx="1150" cy="522" r="22" fill="#e2efed"/><text x="1150" y="530" text-anchor="middle" font-size="20" font-weight="700" fill="#0e5f5b">6</text><text x="1190" y="530" text-anchor="start" font-size="24" font-weight="650" fill="#1c1f23">Ownership</text><text x="1128" y="590" text-anchor="start" font-size="18" font-weight="500" fill="#6b7178">Active owner, sharing</text><path d="M1300 334 V400 H300 V466" fill="none" stroke="#7fb3ae" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="293,460 307,460 300,470" fill="#7fb3ae"/><rect x="1100" y="724" width="400" height="60" rx="30" fill="#0e5f5b"/><text x="1300" y="762" text-anchor="middle" font-size="21" font-weight="600" fill="#ffffff">Log the root cause</text><path d="M1300 634 V716" fill="none" stroke="#7fb3ae" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(1552,856)"><rect x="-200.0" y="-22" width="200.0" height="32" rx="16" fill="#ffffff" stroke="#d9d3c7"/><text x="-14" y="-1" text-anchor="end" font-size="15" fill="#6b7178" font-weight="500">Illustrative diagram</text></g>
</svg>