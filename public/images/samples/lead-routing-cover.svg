<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Illustrative diagram of a lead routing Flow">
<defs>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#e3ded4"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1c1f23" flood-opacity="0.08"/></filter>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#faf8f4"/><stop offset="1" stop-color="#eaf2f0"/></linearGradient>
  
</defs>
<rect width="1600" height="1000" fill="#f7f5f0"/>
<rect width="1600" height="1000" fill="url(#dots)"/>
<text x="72" y="84" text-anchor="start" font-size="15" font-weight="600" fill="#6b7178" letter-spacing="2.4">LEAD ROUTING · RECORD-TRIGGERED FLOW</text><g transform="translate(0,0) scale(1.0)"><rect x="680" y="112" width="240" height="60" rx="30" fill="#0e5f5b" filter="url(#shadow)"/><text x="800" y="149" text-anchor="middle" font-size="21" font-weight="600" fill="#ffffff">Lead created</text><line x1="800" y1="172" x2="800" y2="226" stroke="#7fb3ae" stroke-width="2.5" stroke-linecap="round"/><polygon points="793,224 807,224 800,234" fill="#7fb3ae"/><rect x="630.0" y="236.0" width="340" height="76" rx="14" fill="#ffffff" stroke="#d9d3c7" stroke-width="1.5" filter="url(#shadow)"/><text x="800" y="270" text-anchor="middle" font-size="20" font-weight="600" fill="#1c1f23">Get routing rule</text><text x="800" y="296" text-anchor="middle" font-size="15" font-weight="500" fill="#6b7178">Lead_Routing_Rule__mdt</text><line x1="800" y1="312" x2="800" y2="346" stroke="#7fb3ae" stroke-width="2.5" stroke-linecap="round"/><polygon points="793,344 807,344 800,354" fill="#7fb3ae"/><polygon points="800,354 900,414 800,474 700,414" fill="#ffffff" stroke="#0e5f5b" stroke-width="2" filter="url(#shadow)"/><text x="800" y="421" text-anchor="middle" font-size="18" font-weight="600" fill="#1c1f23">Rule match?</text><line x1="800" y1="474" x2="800" y2="516" stroke="#7fb3ae" stroke-width="2.5" stroke-linecap="round"/><path d="M290 540 V516 H1310 V540" fill="none" stroke="#7fb3ae" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283,546 297,546 290,556" fill="#7fb3ae"/><polygon points="623,546 637,546 630,556" fill="#7fb3ae"/><polygon points="963,546 977,546 970,556" fill="#7fb3ae"/><polygon points="1303,546 1317,546 1310,556" fill="#7fb3ae"/><rect x="155.0" y="558.0" width="270" height="88" rx="14" fill="#ffffff" stroke="#d9d3c7" stroke-width="1.5" filter="url(#shadow)"/><text x="290" y="598" text-anchor="middle" font-size="20" font-weight="600" fill="#1c1f23">EMEA queue</text><text x="290" y="624" text-anchor="middle" font-size="15" font-weight="500" fill="#6b7178">Mid-market and SMB</text><rect x="495.0" y="558.0" width="270" height="88" rx="14" fill="#ffffff" stroke="#d9d3c7" stroke-width="1.5" filter="url(#shadow)"/><text x="630" y="598" text-anchor="middle" font-size="20" font-weight="600" fill="#1c1f23">North America</text><text x="630" y="624" text-anchor="middle" font-size="15" font-weight="500" fill="#6b7178">All segments</text><rect x="835.0" y="558.0" width="270" height="88" rx="14" fill="#ffffff" stroke="#d9d3c7" stroke-width="1.5" filter="url(#shadow)"/><text x="970" y="598" text-anchor="middle" font-size="20" font-weight="600" fill="#1c1f23">APAC queue</text><text x="970" y="624" text-anchor="middle" font-size="15" font-weight="500" fill="#6b7178">All segments</text><rect x="1175.0" y="558.0" width="270" height="88" rx="14" fill="#fcf3e2" stroke="#e8c98f" stroke-width="1.5" filter="url(#shadow)"/><text x="1310" y="598" text-anchor="middle" font-size="20" font-weight="600" fill="#1c1f23">Fallback queue</text><text x="1310" y="624" text-anchor="middle" font-size="15" font-weight="500" fill="#9a6206">No rule matched</text><path d="M290 646 V690 H1310 V646" fill="none" stroke="#7fb3ae" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="800" y1="690" x2="800" y2="730" stroke="#7fb3ae" stroke-width="2.5" stroke-linecap="round"/><polygon points="793,728 807,728 800,738" fill="#7fb3ae"/><rect x="580.0" y="738.0" width="440" height="80" rx="14" fill="#e2efed" stroke="#7fb3ae" stroke-width="1.5" filter="url(#shadow)"/><text x="800" y="774" text-anchor="middle" font-size="20" font-weight="600" fill="#1c1f23">Scheduled path · +1 business day</text><text x="800" y="800" text-anchor="middle" font-size="15" font-weight="500" fill="#0e5f5b">Runs only if Status is still New</text><line x1="800" y1="818" x2="800" y2="852" stroke="#7fb3ae" stroke-width="2.5" stroke-linecap="round"/><polygon points="793,850 807,850 800,860" fill="#7fb3ae"/><rect x="630" y="860" width="340" height="58" rx="29" fill="#ffffff" stroke="#0e5f5b" stroke-width="2"/><text x="800" y="896" text-anchor="middle" font-size="18" font-weight="600" fill="#0e5f5b">Notify manager + follow-up task</text></g>
<g transform="translate(1552,956)"><rect x="-200.0" y="-22" width="200.0" height="32" rx="16" fill="#ffffff" stroke="#d9d3c7"/><text x="-14" y="-1" text-anchor="end" font-size="15" fill="#6b7178" font-weight="500">Illustrative diagram</text></g>
</svg>